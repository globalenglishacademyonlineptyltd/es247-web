name: Validate ES 24/7
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  syntax-install-and-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: es247
          POSTGRES_PASSWORD: es247_test_password
          POSTGRES_DB: es247_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U es247 -d es247_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://es247:es247_test_password@localhost:5432/es247_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run check
      - name: Run database schema migration twice
        run: node --input-type=module -e "import { migrate, pool } from './src/db.js'; try { await migrate(); await migrate(); console.log('Fresh PostgreSQL migration and repeat/idempotency check passed.'); } finally { await pool.end(); }"
