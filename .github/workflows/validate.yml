name: Validate ES 24/7
on:
  push:
    branches: [main, safe-client-terms-menu, 'security/**']
  pull_request:
    branches: [main, safe-client-terms-menu]
jobs:
  syntax-and-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install
      - run: npm run check
