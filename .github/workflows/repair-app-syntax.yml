name: Repair generated app syntax
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair accidental literal newlines
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('public/app.js')
          s = p.read_text()
          s2 = s.replace(r'\\n//', '\n//')
          if s2 != s:
              p.write_text(s2)
          PY
          node --check public/app.js
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/app.js
          git diff --cached --quiet || git commit -m 'Fix app.js syntax after map repair'
          git push
